name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt / clippy / test
    # macOS runner: this is a macOS-targeted Tauri app, so it avoids the
    # GTK/WebKit system-dependency setup a Linux build would require.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rustup reads src-tauri/rust-toolchain.toml and installs the
        # pinned channel plus the clippy/rustfmt components it declares.
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test

  audit:
    name: supply-chain advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Advisory scan
        run: cargo deny check advisories
