name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt / clippy / test
    # macOS runner: this is a macOS-targeted Tauri app, so it avoids the
    # GTK/WebKit system-dependency setup a Linux build would require.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # rustup reads src-tauri/rust-toolchain.toml (this job's
        # working-directory). The repo-root rust-toolchain.toml is
        # for `cargo tauri` from the repository root.
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: UI tests
        # The popover's pure modules (formatting, model) under Node's own
        # test runner; macOS runners ship Node, so nothing is installed.
        # The shell expands the glob, so any Node with node:test works.
        working-directory: .
        run: node --test tests/ui/*.test.mjs

  audit:
    name: supply-chain (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny check
