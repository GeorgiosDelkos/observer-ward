# Local hooks only — no pinned external hook repo to version-bump.
# Install with: prek install
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
        pass_filenames: false
        files: \.rs$
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings
        pass_filenames: false
        files: \.rs$
