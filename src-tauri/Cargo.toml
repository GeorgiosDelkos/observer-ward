[package]
name = "observer-ward"
version = "0.1.0"
edition = "2024"
description = "macOS menu-bar dashboard for Kubernetes, SSH hosts, and Grafana alerts"
license = "MIT"
repository = "https://github.com/GeorgiosDelkos/observer-ward"
homepage = "https://github.com/GeorgiosDelkos/observer-ward"
readme = "../README.md"
authors = ["Georgios Delkos"]
# Application pin: matches rust-toolchain.toml. Not a published library.
rust-version = "1.99"

[lib]
name = "observer_ward_lib"
# Desktop only: the staticlib/cdylib outputs exist for Tauri mobile
# targets, which this macOS menu-bar app does not build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
# Only the features this crate uses directly: Notify (sync), JoinSet (rt),
# sleep/timeout/Instant (time), select!/join! (macros). Transitive crates
# (tauri, kube) pull in their own tokio features via Cargo feature unification.
# process: exec credential plugins and the login shell (k8s/exec_auth.rs).
tokio = { version = "1.54", features = ["rt", "macros", "time", "sync", "process"] }
russh = "0.65.2"
# `aws-lc-rs` makes kube install aws-lc-rs as rustls' process default before
# it builds a TLS config. Without it, kube's default `ring` and reqwest's
# aws-lc-rs leave rustls with two providers and no default, and
# `ClientConfig::builder()` panics on every connect; nothing fails at build
# time (`k8s::tests::client_builds_with_one_crypto_provider` does).
# default-features = false drops `ring`, so aws-lc-rs is the only provider
# built.
kube = { version = "5.1", default-features = false, features = [
    "client",
    "config",
    "rustls-tls",
    "aws-lc-rs",
] }
k8s-openapi = { version = "0.29", features = ["v1_34"] }
http = "1"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-notification = "2.8"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
# Direct HTTP client for the Grafana alerts API. 0.13 is the version Tauri
# 2.12 already links, so the build carries one reqwest. `rustls` uses the
# aws-lc-rs provider and the platform verifier (the macOS trust store).
# default-features = false drops charset, http2 and system-proxy: a plain
# JSON GET needs none of them.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Only for naming `url::ParseError` in GrafanaError; already in the tree
# via reqwest, so it adds no new crate.
url = "2.5"
# OS keychain for the Grafana service-account token (a secret, so it is
# never written to config.json). keyring 4.2's default `v1` feature
# initializes the macOS Keychain on the first `Entry::new`.
keyring = "4.2"
# Native file pickers for the kubeconfig and SSH key fields (a webview
# <input type=file> cannot return a real filesystem path).
tauri-plugin-dialog = "2.8"

# macOS only. Tauri 2.12 already links objc2-foundation 0.3.2; this
# direct edge is so the process can call NSProcessInfo. Pin the exact
# crate already in Cargo.lock: a newer 0.3 would replace the objc2
# Tauri is built against.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSProcessInfo",
    "NSString",
] }

[dev-dependencies]
tempfile = "3.25"
proptest = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
