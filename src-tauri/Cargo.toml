[package]
name = "observer-ward"
version = "0.1.0"
edition = "2024"
description = "macOS menu-bar dashboard for Kubernetes, SSH hosts, and Grafana alerts"
license = "MIT"
repository = "https://github.com/GeorgiosDelkos/observer-ward"
homepage = "https://github.com/GeorgiosDelkos/observer-ward"
readme = "../README.md"
authors = ["Georgios Delkos"]
# Application pin: matches rust-toolchain.toml. Not a published library.
rust-version = "1.98"

[lib]
name = "observer_ward_lib"
# Desktop only: the staticlib/cdylib outputs exist for Tauri mobile
# targets, which this macOS menu-bar app does not build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
# Only the features this crate uses directly: Notify (sync), JoinSet (rt),
# sleep/timeout/Instant (time), select!/join! (macros). Transitive crates
# (tauri, kube) pull in their own tokio features via Cargo feature unification.
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
russh = "0.60.3"
kube = { version = "3.0", features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.27", features = ["v1_31"] }
http = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
# Direct HTTP client for the Grafana alerts API. rustls-tls (not the
# default native-tls) matches kube's TLS backend so the build links one
# TLS stack, not two. default-features = false drops the unused native-tls
# default; a plain GET needs none of the dropped features.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Only for naming `url::ParseError` in GrafanaError; already in the tree
# via reqwest, so it adds no new crate.
url = "2.5"
# OS keychain for the Grafana service-account token (a secret, so it is
# never written to config.json). keyring 4.2's default `v1` feature
# initializes the macOS Keychain on the first `Entry::new`.
keyring = "4.2"
# Native file pickers for the kubeconfig and SSH key fields (a webview
# <input type=file> cannot return a real filesystem path). Cargo.lock holds
# 2.7.3 with tauri 2.11.5: 2.8 requires tauri 2.12, which also bumps
# tray-icon under the macOS 27 tray-click workarounds. Upgrade them together.
tauri-plugin-dialog = "2.7"

# macOS only. Tauri 2.11.5 already links objc2-foundation 0.3.2; this
# direct edge is so the process can call NSProcessInfo. Pin the exact
# crate already in Cargo.lock: a newer 0.3 would replace the objc2
# Tauri is built against.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSProcessInfo",
    "NSString",
] }

[dev-dependencies]
tempfile = "3.25"
proptest = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
