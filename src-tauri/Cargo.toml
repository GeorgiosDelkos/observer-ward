[package]
name = "observer-ward"
version = "0.1.0"
edition = "2021"

[lib]
name = "observer_ward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-positioner = { version = "2.3", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
tokio = { version = "1", features = ["full"] }
russh = "0.57"
kube = { version = "3.0", features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.27", features = ["v1_31"] }
http = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.25"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
