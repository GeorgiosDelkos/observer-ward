[package]
name = "observer-ward"
version = "0.1.0"
edition = "2021"
# MSRV floor: poller.rs uses Duration::from_mins, stabilized in Rust 1.91.
rust-version = "1.91"

[lib]
name = "observer_ward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-positioner = { version = "2.3", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
# Only the features this crate uses directly: Notify (sync), JoinSet (rt),
# sleep/timeout/Instant (time), select!/join! (macros). Transitive crates
# (tauri, kube) pull in their own tokio features via Cargo feature unification.
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
russh = "0.60.3"
kube = { version = "3.0", features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.27", features = ["v1_31"] }
http = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
# Direct HTTP client for the Grafana alerts API. rustls-tls (not the
# default native-tls) matches kube's TLS backend so the build links one
# TLS stack, not two. default-features = false drops the unused native-tls
# default; a plain GET needs none of the dropped features.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# OS keychain for the Grafana service-account token (a secret, so it is
# never written to config.json). keyring v4 selects the platform-native
# backend automatically at compile time (no feature flags needed); on
# macOS this is the Security framework Keychain.
keyring = "4"

[dev-dependencies]
tempfile = "3.25"
proptest = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
