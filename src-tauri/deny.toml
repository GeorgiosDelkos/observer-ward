# cargo-deny configuration for the supply-chain CI gate.
# Run with: cargo deny check

[advisories]
version = 2
# Only flag UNMAINTAINED crates we depend on directly. The transitive ones
# (checked 2026-11-18 with unmaintained = "all") cannot be replaced from here:
# - proc-macro-error (via glib) and zvariant, zvariant_derive, zbus_names (via
#   zbus 5, from keyring's Secret Service store and tauri-plugin-notification)
#   build only for Linux, which this macOS app does not ship;
# - chrono (RUSTSEC-2026-0543) is a wasm32-only dependency of russh-util, so
#   it is not built here either.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses plus MPL-2.0 (file-level copyleft, compatible with
# distributing this MIT app). Copyleft licenses such as LGPL appear in the
# tree only as an alternative in an OR expression, so they stay off the list.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Build-time dependency of the GTK system-deps chain (Linux backend).
[[licenses.exceptions]]
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

# Build-time dependency of psm (stack growth for pest, via kube's
# jsonpath-rust). It writes archives during the build and is not linked in.
[[licenses.exceptions]]
crate = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
# Tauri, russh and kube each pin their own versions of shared crates
# (windows-*, crypto primitives, toml); this app cannot unify them.
multiple-versions = "allow"
