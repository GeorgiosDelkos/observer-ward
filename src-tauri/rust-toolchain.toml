[toolchain]
# Pinned so the clippy lint set is reproducible across machines and CI.
# `clippy::duration_suboptimal_units` (and others) are version-specific;
# pinning prevents the documented `-D warnings` gate from silently
# breaking on a toolchain bump. Bump deliberately, then re-run clippy.
channel = "1.95.0"
components = ["rustfmt", "clippy"]
