<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observer Ward</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "JetBrains Mono", "SF Mono", "Menlo", monospace;
      background: #0a0a0f;
      color: #b0fbff;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 255, 240, 0.15);
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00fff0;
      text-shadow: 0 0 10px rgba(0, 255, 240, 0.5);
    }
    .server-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #4a5568;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">OBSERVER WARD</span>
    </div>
    <div class="server-list">
      <div class="empty-state">
        <p>No servers configured</p>
      </div>
    </div>
  </div>
</body>
</html>
