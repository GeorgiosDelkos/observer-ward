<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observer Ward</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="win" id="win">
    <!-- Blurred colour fields behind the glass; the coral one shows only
         while something is critical. -->
    <div class="aurora" aria-hidden="true">
      <i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><i class="a-alert"></i>
    </div>

    <header class="top" id="top"></header>
    <main class="page" id="page"><div id="content"></div></main>
    <footer class="bottom" id="bottom"></footer>

    <div class="menu" id="menu" role="menu" hidden></div>
    <div class="overlay" id="overlay" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
    </div>
  </div>

  <!-- Shared soft glow for gauge arcs and sparklines. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </svg>

  <script type="module" src="app.js"></script>
</body>
</html>
