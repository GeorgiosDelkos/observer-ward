<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observer Ward</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="header-side">
        <div class="ward-eye">
          <div class="ward-core"></div>
          <div class="ward-ring ward-ring-outer"></div>
          <div class="ward-ring ward-ring-inner"></div>
        </div>
      </div>
      <div class="header-center">
        <span class="title">OBSERVER WARD</span>
        <span id="sync-label" class="sync-label">syncing</span>
      </div>
      <div class="header-side">
        <button id="btn-open-add" class="btn-icon"
                title="Add server">&#x2295;</button>
      </div>
    </div>

    <!-- Add Server Form (hidden by default) -->
    <div id="add-form-panel" class="add-form-panel">
      <div class="add-form-inner">
        <div class="form-title">Add Server</div>
        <form id="add-form" autocomplete="off">
          <div class="form-group">
            <label for="field-name">Name</label>
            <input id="field-name" type="text"
                   placeholder="e.g. prod-cluster" required>
          </div>
          <div class="form-group">
            <label for="field-type">Type</label>
            <select id="field-type">
              <option value="k8s">Kubernetes</option>
              <option value="ssh">SSH</option>
            </select>
          </div>

          <!-- K8s-specific fields -->
          <div class="form-group field-k8s">
            <label for="field-context">Context</label>
            <input id="field-context" type="text"
                   placeholder="e.g. prod-ctx">
          </div>
          <div class="form-group field-k8s">
            <label for="field-namespace">Namespace</label>
            <input id="field-namespace" type="text"
                   placeholder="e.g. default" required>
          </div>
          <div class="form-group field-k8s">
            <label for="field-kubeconfig">
              Kubeconfig path (optional)
            </label>
            <input id="field-kubeconfig" type="text"
                   placeholder="~/.kube/config">
          </div>

          <!-- SSH-specific fields -->
          <div class="form-group field-ssh hidden">
            <label for="field-host">Host</label>
            <input id="field-host" type="text"
                   placeholder="e.g. 10.0.1.50">
          </div>
          <div class="form-group field-ssh hidden">
            <label for="field-port">Port</label>
            <input id="field-port" type="number"
                   value="22" min="1" max="65535">
          </div>
          <div class="form-group field-ssh hidden">
            <label for="field-user">User</label>
            <input id="field-user" type="text"
                   placeholder="e.g. admin">
          </div>
          <div class="form-group field-ssh hidden">
            <label for="field-keypath">Key path</label>
            <input id="field-keypath" type="text"
                   placeholder="~/.ssh/id_ed25519">
          </div>

          <div id="form-error" class="form-error"></div>
          <div class="form-actions">
            <button type="submit" id="btn-add"
                    class="btn btn-primary">Add</button>
            <button type="button" id="btn-cancel"
                    class="btn btn-cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Grafana Alerts (populated by alerts-update events) -->
    <div id="alerts-section" class="alerts-section hidden">
      <div class="alerts-header">
        <span class="alerts-title">GRAFANA ALERTS</span>
        <span id="alerts-status" class="alerts-status"></span>
      </div>
      <div id="alerts-list" class="alerts-list"></div>
    </div>

    <!-- Server List -->
    <div id="server-list" class="server-list">
      <div class="empty-state">
        <div class="empty-state-icon">&#x25C8;</div>
        <div class="empty-state-text">
          No servers configured<br>
          Click + to add one
        </div>
      </div>
    </div>

    <!-- Settings Panel (hidden by default) -->
    <div id="settings-panel" class="settings-panel">
      <div class="settings-header">
        <span class="settings-title">SETTINGS</span>
        <button id="btn-close-settings"
                class="btn-icon">&times;</button>
      </div>
      <div class="settings-body">
        <div class="settings-row">
          <label for="fg-interval">
            Foreground interval (s)
          </label>
          <input type="number" id="fg-interval"
                 min="5" max="120" value="10">
        </div>
        <div class="settings-row">
          <label for="bg-interval">
            Background interval (s)
          </label>
          <input type="number" id="bg-interval"
                 min="30" max="600" value="300">
        </div>
        <div class="settings-row">
          <label for="autostart-toggle">
            Launch at login
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="autostart-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <label for="notifications-toggle">
            Threshold alerts
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="notifications-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-row">
          <label for="grafana-enabled">Grafana alerts</label>
          <label class="toggle-switch">
            <input type="checkbox" id="grafana-enabled">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <label for="grafana-url">Grafana URL</label>
          <input type="text" id="grafana-url"
                 placeholder="https://grafana.internal">
        </div>
        <div class="settings-row">
          <label for="grafana-verify-tls">Verify TLS</label>
          <label class="toggle-switch">
            <input type="checkbox" id="grafana-verify-tls" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <label for="grafana-token">API token</label>
          <input type="password" id="grafana-token"
                 placeholder="(stored; leave blank to keep)">
        </div>
        <div class="settings-actions">
          <button id="btn-save-settings"
                  class="btn btn-primary">SAVE</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn-settings" id="btn-settings">
        &#x2699; Settings
      </button>
    </div>

  </div>

  <!-- Context Menu (hidden) -->
  <div id="context-menu" class="context-menu">
    <div id="ctx-open-terminal" class="context-menu-item">Open Terminal</div>
    <div id="ctx-copy-kubectl" class="context-menu-item">Copy kubectl context</div>
    <div id="ctx-view-logs" class="context-menu-item">View Logs</div>
    <div id="ctx-copy-metrics" class="context-menu-item">Copy Metrics</div>
    <div class="context-menu-separator"></div>
    <div id="ctx-remove" class="context-menu-item danger">Remove</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
